<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cognexa Code — Taskmaster</title><style>:root{--bg:#070a10;--p:#111927;--l:#283248;--t:#f5f7fb;--m:#9aa7bb;--a:#7c5cff;--g:#35d58a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#29185c,transparent 32%),var(--bg);color:var(--t);font:14px system-ui;padding:18px}.wrap{max-width:1150px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:var(--m)}.grid{display:grid;grid-template-columns:350px 1fr;gap:15px}.card{background:#111927eF;border:1px solid var(--l);border-radius:18px;padding:18px}textarea,input,button,select{font:inherit;border-radius:10px;border:1px solid var(--l);background:#0a101a;color:#fff;padding:11px;width:100%;margin:5px 0}button{background:var(--a);border:0;cursor:pointer}.muted{color:var(--m)}.agents{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.agent{padding:7px 9px;border:1px solid var(--l);border-radius:10px}.task{padding:13px;border-bottom:1px solid var(--l);display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}.task input{width:auto}.done{text-decoration:line-through;opacity:.55}.tag{font-size:11px;background:#202b40;padding:5px 7px;border-radius:20px}.log{white-space:pre-wrap;background:#080d15;padding:13px;border-radius:12px;max-height:300px;overflow:auto}.mcp{margin-top:15px}.tools{white-space:pre-wrap;color:var(--g)}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><h1>Cognexa Code</h1><a href="/">← Cognexa</a></div><p class="muted">Multi-agent coding workspace: Planner → Architect → Coder → Reviewer → Tester, with dependencies, MCP and automatic model fallback.</p><div class="grid"><section class="card"><h2>Project</h2><textarea id="goal" rows="8" placeholder="Describe the coding project or bug…"></textarea><button id="plan">Plan with multi-agents</button><p id="status" class="muted"></p><h3>Agents</h3><div class="agents" id="agents"></div><section class="mcp"><h3>MCP</h3><input id="mcp" placeholder="https://server.example/mcp"><input id="auth" type="password" placeholder="Bearer token (optional)"><button id="toolsBtn">Discover tools</button><div id="tools" class="tools"></div></section></section><section class="card"><h2>Execution board</h2><div id="tasks" class="log">No plan yet.</div><h3>Planner output</h3><div id="raw" class="log">Waiting…</div></section></div></main><script>const $=x=>document.getElementById(x),agents=[['planner','Planner','Breaks the request into tasks'],['architect','Architect','Designs architecture and interfaces'],['coder','Coder','Produces implementation guidance'],['reviewer','Reviewer','Checks correctness and security'],['tester','Tester','Designs tests and regression checks']];$('agents').innerHTML=agents.map(a=>`<span class="agent"><b>${a[1]}</b><br><small class="muted">${a[2]}</small></span>`).join('');let tasks=[];function cfg(){const p=JSON.parse(localStorage.getItem('llm_keys')||'{}');const defs={groq:['Groq','https://api.groq.com/openai/v1','llama-3.3-70b-versatile'],google:['Google AI Studio','https://generativelanguage.googleapis.com/v1beta/openai','gemini-2.5-flash'],hf:['Hugging Face','https://router.huggingface.co/v1','meta-llama/Llama-3.1-8B-Instruct'],cohere:['Cohere','https://api.cohere.com/compatibility/v1','command-a-03-2025'],nvidia:['NVIDIA NIM','https://integrate.api.nvidia.com/v1','meta/llama-3.1-8b-instruct'],zai:['Z.AI','https://api.z.ai/api/paas/v4','glm-4.5-flash'],llm7:['LLM7.io','https://api.llm7.io/v1','gpt-4o-mini'],openrouter:['OpenRouter','https://openrouter.ai/api/v1','openai/gpt-oss-20b:free'],requesty:['Requesty','https://router.requesty.ai/v1','openai/gpt-4o-mini'],venice:['Venice.ai','https://api.venice.ai/api/v1','llama-3.3-70b'],together:['Together AI','https://api.together.ai/v1','meta-llama/Llama-3.3-70B-Instruct-Turbo'],fireworks:['Fireworks AI','https://api.fireworks.ai/inference/v1','accounts/fireworks/models/llama-v3p1-8b-instruct'],deepseek:['DeepSeek','https://api.deepseek.com/v1','deepseek-chat']};return Object.entries(p).filter(([id,key])=>defs[id]&&key).map(([id,key],i)=>{const d=defs[id];return{id,name:d[0],baseUrl:d[1],apiKey:key,model:d[2],priority:100-i,enabled:true}})}$('plan').onclick=async()=>{const goal=$('goal').value.trim(),providers=cfg();if(!goal)return;if(!providers.length){$('status').textContent='Configure at least one provider on Cognexa first.';return}$('status').textContent='Running Planner → Architect → Coder → Reviewer → Tester…';$('raw').textContent='';try{const r=await fetch('/api/plan',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({goal,providers})});const d=await r.json();if(!r.ok)throw Error(d.error||'Planning failed');tasks=(d.tasks||[]).map((t,i)=>({...t,done:false,id:t.id||'task-'+(i+1)}));draw();$('raw').textContent=`Selected provider: ${d.provider?.name||''} / ${d.provider?.model||''}\n\n${JSON.stringify(tasks,null,2)}`;$('status').textContent=`Plan ready: ${tasks.length} tasks. Independent tasks can be worked in parallel.`}catch(e){$('status').textContent=e.message}};function draw(){$('tasks').innerHTML=tasks.map((t,i)=>`<div class="task"><input type="checkbox" ${t.done?'checked':''} onchange="tasks[${i}].done=this.checked;draw()"><div class="${t.done?'done':''}"><b>${i+1}. ${t.title}</b><div class="muted">${t.detail||''}</div><small>Agent: ${t.agent||'planner'} · Depends: ${(t.dependsOn||[]).join(', ')||'none'} · Priority: ${t.priority||'medium'}</small></div><span class="tag">${t.done?'done':t.status||'todo'}</span></div>`).join('')||'No tasks yet.'}$('toolsBtn').onclick=async()=>{const url=$('mcp').value.trim();if(!url)return;$('tools').textContent='Connecting…';try{const r=await fetch('/api/mcp',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url,authorization:$('auth').value,request:{jsonrpc:'2.0',id:1,method:'tools/list',params:{}}})});const d=await r.json();$('tools').textContent=JSON.stringify(d.data||d,null,2)}catch(e){$('tools').textContent=e.message}};draw();</script></body></html>

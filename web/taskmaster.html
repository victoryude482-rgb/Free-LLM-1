<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeLLM Taskmaster</title><style>body{margin:0;background:#080b12;color:#f5f7fb;font:15px system-ui;padding:24px}.wrap{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}.card{background:#111827;border:1px solid #283248;border-radius:18px;padding:18px}.row{display:flex;gap:8px;margin:8px 0}input,textarea,select,button{font:inherit;border-radius:10px;border:1px solid #303b52;background:#0b1220;color:#fff;padding:11px}input,textarea,select{width:100%;box-sizing:border-box}button{cursor:pointer;background:#7658ff;border:0}.muted{color:#9aa7bb}.task{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid #263044}.task input{width:auto}.done{text-decoration:line-through;opacity:.55}.tag{font-size:11px;border-radius:20px;padding:4px 7px;background:#25304a}.danger{background:#9b3344}.log{white-space:pre-wrap;background:#080d16;border-radius:12px;padding:12px;min-height:180px;max-height:350px;overflow:auto}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>Taskmaster</h1><p class="muted">Claude-Code-style coding planner: turn a goal into ordered tasks, track dependencies, and use your connected LLM/MCP tools.</p><div class="grid"><section class="card"><h2>Plan a coding task</h2><textarea id="goal" rows="7" placeholder="Example: Fix authentication and add tests..."></textarea><div class="row"><select id="mode"><option>Plan only</option><option>Plan + implementation guidance</option></select></div><button id="plan">Generate task plan</button><p id="status" class="muted"></p><hr><h3>MCP connection</h3><input id="mcp" placeholder="https://your-mcp-server.example/mcp"><input id="mcpAuth" placeholder="Optional bearer token" type="password"><button id="mcpTest">List MCP tools</button><p id="mcpStatus" class="muted"></p></section><section class="card"><h2>Execution board</h2><div id="tasks"></div><h3>Planner output</h3><div id="log" class="log">No plan yet.</div></section></div></main><script>const $=x=>document.getElementById(x);let tasks=[];function draw(){ $('tasks').innerHTML=tasks.map((t,i)=>`<div class="task"><input type="checkbox" ${t.done?'checked':''} onchange="tasks[${i}].done=this.checked;draw()"><span class="${t.done?'done':''}"><b>${i+1}. ${t.title}</b><br><span class="muted">${t.detail||''}</span></span><span class="tag">${t.status||'todo'}</span></div>`).join('')||'<p class="muted">Tasks will appear here.</p>'}async function chat(goal){const base=localStorage.getItem('llmBase'),key=localStorage.getItem('llmKey'),model=localStorage.getItem('llmModel');if(!base||!key||!model)throw Error('Connect an LLM first on the main Free LLM page.');const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({baseUrl:base,apiKey:key,model,messages:[{role:'system',content:'You are a coding task planner. Return ONLY a JSON array of 5-15 tasks. Each item must have title, detail, status, dependsOn (array of task numbers), priority. Make tasks concrete, ordered, testable, and suitable for an AI coding agent.'},{role:'user',content:goal}]})});const d=await r.json();if(!r.ok)throw Error(d.error?.message||'LLM failed');return d.choices?.[0]?.message?.content||''}$('plan').onclick=async()=>{const goal=$('goal').value.trim();if(!goal)return;$('status').textContent='Planning...';try{const raw=await chat(goal);$('log').textContent=raw;const clean=raw.replace(/^```json\s*/,'').replace(/```$/,'').trim();tasks=JSON.parse(clean).map(x=>({...x,done:false}));draw();$('status').textContent='Plan ready. Complete tasks in order.'}catch(e){$('status').textContent=e.message;$('log').textContent='Planner could not parse the model response.\n\n'+e.message}};$('mcpTest').onclick=async()=>{const url=$('mcp').value.trim();if(!url)return;$('mcpStatus').textContent='Connecting...';try{const r=await fetch('/api/mcp',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url,authorization:$('mcpAuth').value,request:{jsonrpc:'2.0',id:1,method:'tools/list',params:{}}})});const d=await r.json();$('mcpStatus').textContent=r.ok?'MCP response received. Tools are available through the connection.':(d.error||'MCP failed');$('log').textContent=JSON.stringify(d.data||d,null,2)}catch(e){$('mcpStatus').textContent=e.message}};draw();</script></body></html>
